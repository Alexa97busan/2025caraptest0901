<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기출 유형 문제</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --fill: rgba(118, 118, 128, 0.12);
    --fg: #1c1c1e;
    --fg-2: #6e6e73;
    --line: rgba(60, 60, 67, 0.14);
    --accent: #007aff;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --good: #248a3d;
    --good-soft: rgba(52, 199, 89, 0.16);
    --warn: #c93400;
    --warn-soft: rgba(255, 149, 0, 0.18);
    --bad: #d70015;
    --bad-soft: rgba(255, 59, 48, 0.14);
    --steel: #9aa1ab;
    --steel-dark: #636366;
    --metal: #c9ced6;
    --tire: #2c2c2e;
    --hot: #ff9500;
    --fire: #ff3b30;
    --fluid: #af52de;
    --cool: #5ac8fa;
    --knob: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1c1c1e; --fill: rgba(118, 118, 128, 0.24);
      --fg: #f5f5f7; --fg-2: #98989f; --line: rgba(84, 84, 88, 0.5);
      --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, 0.2);
      --good: #30d158; --good-soft: rgba(48, 209, 88, 0.18);
      --warn: #ff9f0a; --warn-soft: rgba(255, 159, 10, 0.2);
      --bad: #ff453a; --bad-soft: rgba(255, 69, 58, 0.2);
      --steel: #8e8e93; --steel-dark: #aeaeb2; --metal: #48484a; --tire: #0b0b0c;
      --hot: #ff9f0a; --fire: #ff453a; --fluid: #bf5af2; --cool: #64d2ff; --knob: #f5f5f7;
      --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --fill: rgba(118, 118, 128, 0.24);
    --fg: #f5f5f7; --fg-2: #98989f; --line: rgba(84, 84, 88, 0.5);
    --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, 0.2);
    --good: #30d158; --good-soft: rgba(48, 209, 88, 0.18);
    --warn: #ff9f0a; --warn-soft: rgba(255, 159, 10, 0.2);
    --bad: #ff453a; --bad-soft: rgba(255, 69, 58, 0.2);
    --steel: #8e8e93; --steel-dark: #aeaeb2; --metal: #48484a; --tire: #0b0b0c;
    --hot: #ff9f0a; --fire: #ff453a; --fluid: #bf5af2; --cool: #64d2ff; --knob: #f5f5f7;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 20px 40px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-icon { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; background: var(--accent); display: grid; place-items: center; }
  .brand-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
  .sub { margin: 0; font-size: 0.82rem; color: var(--fg-2); }
  .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .model-tag { font-size: 0.75rem; font-weight: 600; color: var(--fg-2); background: var(--fill); padding: 4px 10px; border-radius: 999px; }
  .home-link { color: var(--accent); background: var(--accent-soft); text-decoration: none; transition: transform 0.18s var(--ease-out); }
  .home-link:active { transform: scale(0.95); }
  .home-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .main { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 920px) {
    .main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
    .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  }
  .col { display: grid; gap: 14px; min-width: 0; }

  .panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .panel-title { font-size: 0.95rem; font-weight: 650; margin: 0; }
  .hint { font-size: 0.75rem; color: var(--fg-2); margin: 0; }

  .stage { position: relative; padding: 0; overflow: hidden; }
  .stage canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
  @media (max-width: 560px) { .stage canvas { aspect-ratio: 4 / 3.2; } }
  .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; border-top: 1px solid var(--line); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  button { font: inherit; color: inherit; }
  .btn {
    border: none; cursor: pointer; border-radius: 12px; padding: 9px 14px;
    font-size: 0.85rem; font-weight: 600; background: var(--fill); color: var(--fg);
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform 0.18s var(--ease-out), background-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .btn:active, .btn.is-held { transform: scale(0.95); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-hold.is-held { background: var(--hot); color: #fff; }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .metrics { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 700px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 4px; min-width: 0; align-content: start; }
  .tile-label { font-size: 0.72rem; font-weight: 600; color: var(--fg-2); }
  .tile-value { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
  .tile-unit { font-size: 0.78rem; font-weight: 500; color: var(--fg-2); margin-left: 3px; letter-spacing: 0; }
  .chip { justify-self: start; font-size: 0.7rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--fg-2); transition: background-color 0.25s var(--ease-out), color 0.25s var(--ease-out); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--accent-soft); color: var(--accent); }

  .calc { display: grid; gap: 6px; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  .calc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--fill); align-items: baseline; }
  .calc-row span:first-child { color: var(--fg-2); overflow-wrap: anywhere; }
  .calc-row b { font-weight: 700; white-space: nowrap; }

  .seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--fill); border-radius: 11px; padding: 2px; }
  .seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; background: var(--knob); border-radius: 9px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); transition: transform 0.32s var(--ease-out), width 0.32s var(--ease-out), opacity 0.2s; }
  .seg button { position: relative; z-index: 1; border: none; background: transparent; cursor: pointer; padding: 7px 2px; font-size: 0.78rem; font-weight: 500; border-radius: 9px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button[aria-pressed="true"] { font-weight: 650; color: #1c1c1e; }
  .seg-caption { margin-top: 8px; font-size: 0.76rem; color: var(--fg-2); min-height: 1.2em; }

  .field { display: grid; gap: 4px; padding-block: 10px; border-top: 1px solid var(--line); }
  .field:first-of-type { border-top: none; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .field label { font-size: 0.86rem; font-weight: 600; }
  .field small { display: block; font-size: 0.72rem; color: var(--fg-2); font-weight: 500; }
  .badge { font-size: 0.85rem; font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; background: var(--fill); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8.5px; border-radius: 50%; background: var(--knob); box-shadow: 0 2px 7px rgba(0, 0, 0, 0.18), 0 0 1px rgba(0, 0, 0, 0.3); transition: transform 0.15s var(--ease-out); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.18); }
  input[type=range]::-moz-range-track { height: 5px; background: var(--fill); border-radius: 3px; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--knob); box-shadow: 0 2px 7px rgba(0, 0, 0, 0.18), 0 0 1px rgba(0, 0, 0, 0.3); }

  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .switch-row label { font-size: 0.86rem; font-weight: 600; cursor: pointer; }
  .switch-row label small { display: block; font-size: 0.72rem; color: var(--fg-2); font-weight: 500; }
  .switch { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--fill); transition: background-color 0.25s var(--ease-out); }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15); transition: transform 0.3s var(--ease-out); }
  .switch input:checked + span { background: var(--good); }
  .switch input.danger:checked + span { background: var(--bad); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notes { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .note { min-width: 0; }
  .note h3 { font-size: 0.9rem; margin: 0 0 6px; }
  .note p, .note li { font-size: 0.84rem; color: var(--fg-2); margin: 0; }
  .note ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .note b { color: var(--fg); font-weight: 650; }
  .note table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .note th, .note td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .note th { color: var(--fg-2); font-weight: 600; }
  .note td { color: var(--fg); }
  h2.section { font-size: 1.05rem; margin: 0; letter-spacing: -0.02em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  .wrap { max-width: 860px; }
  .summary { display: grid; gap: 12px; }
  .score-line { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
  .score { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .score small { font-size: 0.85rem; font-weight: 500; color: var(--fg-2); margin-left: 6px; letter-spacing: 0; }
  .progress { position: relative; height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 100%; transform-origin: left center; transform: scaleX(0); transition: transform 0.5s var(--ease-out); border-radius: 999px; }
  .progress .ok { background: var(--good); }
  .progress .ng { background: var(--bad); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter {
    border: none; cursor: pointer; padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    background: var(--fill); color: var(--fg);
    transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out), transform 0.18s var(--ease-out);
  }
  .filter:active { transform: scale(0.95); }
  .filter[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .filter .cnt { font-weight: 500; opacity: 0.75; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .qlist { display: grid; gap: 14px; }
  .q { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
  .q[hidden] { display: none; }
  .q-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .q-num { font-size: 0.75rem; font-weight: 700; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .q-text { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.55; text-wrap: pretty; }
  .opts { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 620px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .opt {
    display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 14px; padding: 11px 12px; font-size: 0.9rem; font-weight: 500; min-width: 0;
    transition: border-color 0.2s var(--ease-out), background-color 0.2s var(--ease-out), transform 0.18s var(--ease-out);
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(0.98); }
  .opt:disabled { cursor: default; }
  .opt .no {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    background: var(--fill); font-size: 0.78rem; font-weight: 700; color: var(--fg-2);
    transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
  }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .no { background: var(--good); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake 0.32s var(--ease-out); }
  .opt.wrong .no { background: var(--bad); color: #fff; }
  .q.answered .opt:not(.correct):not(.wrong) { opacity: 0.55; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }

  /* 해설: 높이 0 → 내용 높이로 펼침 (grid 트릭) */
  .explain { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s var(--ease-out); }
  .q.answered .explain { grid-template-rows: 1fr; }
  .explain > div { overflow: hidden; }
  .explain-inner { margin-top: 2px; padding: 12px 14px; border-radius: 14px; background: var(--fill); display: grid; gap: 8px; }
  .verdict { font-size: 0.85rem; font-weight: 700; }
  .verdict.ok { color: var(--good); }
  .verdict.ng { color: var(--bad); }
  .explain p { margin: 0; font-size: 0.86rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .explain a { font-size: 0.85rem; font-weight: 650; color: var(--accent); text-decoration: none; justify-self: start; }
  .explain a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--fg-2); font-size: 0.9rem; padding: 24px; }

  @media (prefers-reduced-motion: reduce) { .opt.wrong { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
      </div>
      <div>
        <h1>기출 유형 문제</h1>
        <p class="sub">시뮬레이터 8개 단원의 계산·개념 문제. 답을 고르면 해설과 확인할 시뮬레이터 링크가 열립니다</p>
      </div>
    </div>
    <div class="tag-row">
      <span class="model-tag" id="totalTag">32문제</span>
      <a class="model-tag home-link" href="lab.html">← 물리 시스템 알기</a>
    </div>
  </header>

  <section class="panel summary">
    <div class="score-line">
      <div class="score" id="score">0 / 0<small>정답 / 푼 문제</small></div>
      <div class="btn-row">
        <button class="btn" id="btnWrong" aria-pressed="false">틀린 문제만</button>
        <button class="btn" id="btnReset">다시 풀기</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><i class="ok" id="barOk"></i><i class="ng" id="barNg"></i></div>
    <div class="filters" id="filters" role="group" aria-label="단원 선택"></div>
    <p class="hint">기출 경향을 바탕으로 직접 만든 연습 문제입니다(실제 기출 원문 아님). 푼 기록은 이 브라우저에만 저장됩니다.</p>
  </section>

  <div class="qlist" id="qlist"></div>
</div>

<script>
(() => {
  // ---------- 공통: 테마 토큰, 캔버스, 세그먼트, 길게 누르기 ----------
  const $ = id => document.getElementById(id);
  const C = {};
  const TOKEN_NAMES = ['bg', 'surface', 'fill', 'fg', 'fg-2', 'line', 'accent', 'good', 'warn', 'bad', 'steel', 'steel-dark', 'metal', 'tire', 'hot', 'fire', 'fluid', 'cool', 'knob'];
  function readTokens() {
    const cs = getComputedStyle(document.documentElement);
    TOKEN_NAMES.forEach(t => { C[t] = cs.getPropertyValue('--' + t).trim(); });
    C.font = getComputedStyle(document.body).fontFamily;
  }
  readTokens();
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function fitCanvas(cv) {
    const ctx = cv.getContext('2d');
    const fit = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = cv.getBoundingClientRect();
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cv._w = r.width; cv._h = r.height;
    };
    new ResizeObserver(fit).observe(cv);
    fit();
    return ctx;
  }

  function setChip(el, text, tone) {
    el.textContent = text;
    el.className = 'chip' + (tone ? ' ' + tone : '');
  }

  // 선택 표시가 미끄러져 이동하는 세그먼트 컨트롤
  function initSeg(root, onPick) {
    const thumb = root.querySelector('.seg-thumb');
    const btns = [...root.querySelectorAll('button')];
    function place(animate) {
      const on = btns.find(b => b.getAttribute('aria-pressed') === 'true');
      if (!animate) thumb.style.transition = 'none';
      if (on) {
        thumb.style.opacity = 1;
        thumb.style.width = on.offsetWidth + 'px';
        thumb.style.transform = `translateX(${on.offsetLeft}px)`;
      } else {
        thumb.style.opacity = 0;
      }
      if (!animate) { void thumb.offsetWidth; thumb.style.transition = ''; }
    }
    function select(v) {
      btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
      place(true);
    }
    btns.forEach(b => b.addEventListener('click', () => { select(b.dataset.v); onPick(b.dataset.v); }));
    new ResizeObserver(() => place(false)).observe(root);
    return { select, clear: () => select(null) };
  }

  });

  // 확인 단계를 페이지 안에 둠 (브라우저 confirm 대화상자는 쓰지 않음)
  const btnReset = $('btnReset');
  let armed = false, armTimer = null;
  btnReset.addEventListener('click', () => {
    if (!armed) {
      armed = true; btnReset.textContent = '한 번 더 누르면 기록 삭제'; btnReset.classList.add('btn-hold', 'is-held');
      armTimer = setTimeout(() => { armed = false; btnReset.textContent = '다시 풀기'; btnReset.classList.remove('btn-hold', 'is-held'); }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false;
    btnReset.textContent = '다시 풀기'; btnReset.classList.remove('btn-hold', 'is-held');
    answers = {}; save();
    list.querySelectorAll('.q').forEach(el => { paint(el, QS.find(x => x.id === el.dataset.id), false); el.querySelectorAll('.opt').forEach(b => { b.style.animation = ''; }); });
    updateSummary();
  });

  updateSummary();
})();
</script>
</body>
</html>
