<meta name="description" content="배기량·압축비, 토크·출력(마력), 제동거리, 변속비·차속을 숫자를 바꿔 가며 계산하는 학습용 계산기"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#1d1d1f}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* 구조: 탭 4개(주제) → 각 탭은 [입력 패널 | 결과(핵심 수치 → 그래프 → 풀이 → 공식 → 표)].
   색: 무채색 + 주황(포커스·선택). 그래프 색은 블루(slot1)·오렌지(slot2), 보조선은 회색. 모션은 상태 변화를 알리는 용도만. */
:root {
  --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --ink2: #424245; --muted: #6e6e73;
  --line: #e5e5ea; --line-strong: #c7c7cc; --accent: #0071e3; --bad: #d70015; --bad-tint: rgba(255,59,48,.10);
  --s1: #0071e3; --s2: #e85d00; --sd: #aeaeb2; --ok: #248a3d; --ok-tint: rgba(52,199,89,.12);
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-num: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --ease: cubic-bezier(.16,1,.3,1); --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --ink2: #d1d1d6; --muted: #98989d;
    --line: #2c2c2e; --line-strong: #48484a; --accent: #2997ff; --bad: #ff453a; --bad-tint: rgba(255,69,58,.16);
    --s1: #2997ff; --s2: #ff9f0a; --sd: #636366; --ok: #30d158; --ok-tint: rgba(48,209,88,.16); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --ink2: #d1d1d6; --muted: #98989d;
  --line: #2c2c2e; --line-strong: #48484a; --accent: #2997ff; --bad: #ff453a; --bad-tint: rgba(255,69,58,.16);
  --s1: #2997ff; --s2: #ff9f0a; --sd: #636366; --ok: #30d158; --ok-tint: rgba(48,209,88,.16); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
.page { max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px,4vw,32px) 56px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { margin: 0 0 14px; font-size: 13px; }
.back a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; color: var(--muted); text-decoration: none; transition: color 120ms var(--ease); }
.back a span { display: inline-block; transition: transform 160ms var(--ease); }
.back a:hover, .back a:focus-visible { color: var(--ink); }
.back a:hover span, .back a:focus-visible span { transform: translateX(-4px); }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

/* 탭: 활성 탭 밑줄이 이동하며 "어느 주제인가"를 알린다 (transform 200ms) */
.tabs { position: relative; display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; appearance: none; background: none; border: 0; border-radius: var(--r) var(--r) 0 0; padding: 10px 14px; min-height: 44px; font: 500 14px var(--font-body); color: var(--muted); cursor: pointer; transition: color 120ms var(--ease), background-color 120ms var(--ease); }
.tab:hover { color: var(--ink); background: var(--surface); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab:active { background: var(--line); }
.ind { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100px; background: var(--accent); transform: translateX(0); transition: transform 220ms var(--ease), width 220ms var(--ease); }

.layout { display: grid; grid-template-columns: minmax(0,1fr); gap: 24px; margin-top: 24px; align-items: start; }
@media (min-width: 960px) { .layout { grid-template-columns: 340px minmax(0,1fr); gap: 32px; } .panel { position: sticky; top: 16px; } }
.jump { display: none; margin: 0 0 4px; padding: 0; background: none; border: 0; color: var(--ink); font: 400 13px var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
@media (max-width: 959px) { .jump { display: block; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 16px 16px; min-width: 0; }
.panel h2 { margin: 12px 0 4px; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
.field { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,148px); gap: 8px; align-items: center; font-size: 13px; padding-block: 4px; }
.field[hidden] { display: none; }
.field.duo .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.field.duo { grid-template-columns: 22px minmax(0,1fr); }
.field.duo > label { color: var(--muted); font-family: var(--font-num); font-size: 12px; }
.num { position: relative; }
.num .unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }
input[type="text"], select {
  width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--ink);
  font: 400 14px var(--font-num); padding: 0 38px 0 8px; text-align: right;
  transition: border-color 120ms var(--ease), background-color 120ms var(--ease);
}
.duo input[type="text"] { padding-right: 34px; }
select { font-family: var(--font-body); padding: 0 8px; text-align: left; }
.field.wide { grid-template-columns: 1fr; gap: 4px; }
input[type="text"]:hover, select:hover { border-color: var(--ink); }
input[type="text"]:focus-visible, select:focus-visible { border-color: var(--accent); outline-offset: 0; }
input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-tint); }
.hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

/* 결과 */
.results { min-width: 0; display: grid; gap: 24px; transition: opacity 160ms var(--ease); }
.results.stale > *:not(.notice) { opacity: .4; }
.results > * { transition: opacity 160ms var(--ease); }
.notice { margin: 0; padding: 10px 12px; border: 1px solid var(--bad); border-radius: var(--r); background: var(--bad-tint); font-size: 13px; }
.notice[hidden] { display: none; }
.figs { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
@media (max-width: 720px) { .figs { grid-template-columns: repeat(2,minmax(0,1fr)); } }
.fig { background: var(--surface); padding: 12px 14px; min-width: 0; }
.fig .lbl { display: block; font-size: 12px; color: var(--muted); }
.fig .val { display: block; margin-top: 2px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
.fig .val i { font-style: normal; font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.fig .note { display: block; font-size: 12px; color: var(--muted); min-height: 18px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card .cap { margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; touch-action: pan-y; }
.chart svg:focus-visible { outline-offset: 0; border-radius: var(--r); }
.chart text { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.chart text.dl { font-family: var(--font-body); font-size: 12px; fill: var(--ink2); }
.chart text.mk { font-family: var(--font-num); font-size: 12px; fill: var(--ink); font-weight: 500; }
.chart text.vl { font-family: var(--font-body); font-size: 11px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.chart svg.draggable { cursor: ew-resize; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 6px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 14px; height: 2px; border-radius: 1px; }
.legend .ar { width: 14px; height: 10px; opacity: .22; border-radius: 1px; }
.k-s1 { background: var(--s1); } .k-s2 { background: var(--s2); } .k-sd { background: var(--sd); }
.tip { position: absolute; top: 6px; left: 0; z-index: 2; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 7px 10px; font-size: 12px; min-width: 120px; }
.tip[hidden] { display: none; }
.tip .th { color: var(--muted); font-family: var(--font-num); margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 6px; line-height: 1.7; }
.tip .tr .key { width: 10px; height: 2px; border-radius: 1px; flex: none; }
.tip .tr .nm { color: var(--ink2); flex: 1; }
.tip .tr b { font-family: var(--font-num); font-weight: 500; color: var(--ink); margin-left: 8px; }

.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; padding-top: 4px; }
.steps li::before { content: counter(s); font-family: var(--font-num); font-size: 12px; color: var(--muted); padding-top: 2px; }
.steps .what { font-size: 13px; color: var(--muted); }
.steps code { grid-column: 2; font: 400 13px/1.6 var(--font-num); color: var(--ink); overflow-wrap: anywhere; }
.steps code b { font-weight: 500; color: var(--accent); }
.note-text { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

dl.formula { display: grid; grid-template-columns: minmax(0,max-content) minmax(0,1fr); gap: 6px 18px; margin: 0; font-size: 13px; }
dl.formula dt { color: var(--muted); }
dl.formula dd { margin: 0; font-family: var(--font-num); font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 560px) { dl.formula { grid-template-columns: 1fr; gap: 0; } dl.formula dd { margin-bottom: 8px; } }

details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 13px; color: var(--ink); min-height: 32px; display: flex; align-items: center; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 320px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-num); }
td:first-child { font-family: var(--font-body); }
tr.on td { background: color-mix(in srgb, var(--accent) 9%, transparent); }

.foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
/* Apple 스타일: 테두리 대신 그림자와 큰 모서리. 다크 모드는 그림자 없이 면 색으로 구분 */
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.back a { color: var(--accent); }
.back a:hover, .back a:focus-visible { color: var(--accent); opacity: .8; }
.panel, .card, .figs { border: 0; border-radius: 18px; box-shadow: var(--shadow); }
.panel { padding: 8px 18px 18px; }
.card { padding: 18px 20px 16px; }
.fig { padding: 14px 16px; }
.fig .val { font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 700; }
.tab { border-radius: 10px 10px 0 0; font-weight: 600; }
.ind { border-radius: 2px; }
input[type="text"], select { border-color: var(--line-strong); background: var(--surface); }
.notice { border-radius: 12px; }
/* 문제 풀이: 고르면 정답은 초록, 오답은 빨강으로 짧게 흔들려(320ms) 틀렸음을 알린다. 해설은 아래에서 6px 떠오르며 나타난다 */
.qz { max-width: 760px; margin: 24px auto 0; display: grid; gap: 16px; }
.qz-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.qz-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 0; background: var(--surface); box-shadow: var(--shadow); color: var(--ink2); font: 500 13px var(--font-body); padding: 8px 14px; min-height: 36px; border-radius: 999px; cursor: pointer; transition: background-color 160ms var(--ease), color 160ms var(--ease), transform 120ms var(--ease); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.qz-score { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qz-score b { color: var(--ink); font-weight: 600; }
.qz-card { padding: 22px 22px 20px; }
.qz-meta { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.qz-tag { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.qz-card .qz-q { font-size: 17px; line-height: 1.6; font-weight: 600; margin: 0 0 16px; word-break: keep-all; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 14px; min-height: 52px; font: 500 15px/1.45 var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; word-break: keep-all; transition: border-color 160ms var(--ease), background-color 160ms var(--ease), transform 120ms var(--ease), opacity 200ms var(--ease); }
.qz-opt:hover:not(:disabled) { border-color: var(--line-strong); background: var(--bg); }
.qz-opt:active:not(:disabled) { transform: scale(.985); }
.qz-opt:disabled { cursor: default; }
.qz-opt .n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-num); background: var(--bg); color: var(--muted); transition: background-color 160ms var(--ease), color 160ms var(--ease); }
.qz-opt[data-state="right"] { border-color: var(--ok); background: var(--ok-tint); }
.qz-opt[data-state="right"] .n { background: var(--ok); color: #fff; }
.qz-opt[data-state="wrong"] { border-color: var(--bad); background: var(--bad-tint); animation: qzShake 320ms var(--ease); }
.qz-opt[data-state="wrong"] .n { background: var(--bad); color: #fff; }
.qz-opt[data-state="dim"] { opacity: .45; }
@keyframes qzShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.qz-ex { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); animation: qzIn 240ms var(--ease) both; }
.qz-ex[hidden] { display: none; }
@keyframes qzIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qz-verdict { margin: 0 0 6px; font-weight: 600; font-size: 15px; }
.qz-verdict.ok { color: var(--ok); }
.qz-verdict.no { color: var(--bad); }
.qz-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 10px 18px; min-height: 44px; font: 600 14px var(--font-body); cursor: pointer; transition: transform 120ms var(--ease), opacity 160ms var(--ease); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
.btn[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>

    <p class="sub">숫자를 바꾸면 결과와 그래프가 바로 바뀝니다. 풀이 과정과 공식도 함께 봅니다.</p>

<script>
/* CALC START — 정비 이론 계산식 (순수 함수, 단위는 주석에 표기) */
var G = 9.80665;                 // m/s²  표준 중력가속도
var KW_PER_PS = 0.73549875;      // 1 PS(미터 마력) = 0.73549875 kW
var W_PER_RPM = 2 * Math.PI / 60 / 1000;   // T[N·m] × N[rpm] × W_PER_RPM = kW
var K_SPEED = 2 * Math.PI * 60 / 1000;     // 차속[km/h] = K_SPEED × r[m] × N[rpm] ÷ 총감속비 (≈ 0.377)

/* 배기량·압축비·이론열효율(오토 사이클). D, S: mm / Vc: cc(cm³) */
function calcCompression(p) {
  var d = p.D / 10, s = p.S / 10;                    // cm
  var Vs = Math.PI / 4 * d * d * s;                  // 행정체적 cm³ / 실린더
  var total = Vs * p.n;
  var Vc, eps;
  if (p.mode === "vc") { Vc = p.Vc; eps = (Vc + Vs) / Vc; }
  else { eps = p.eps; Vc = Vs / (eps - 1); }
  var eta = 1 - Math.pow(1 / eps, p.k - 1);
  return { Vs: Vs, total: total, Vc: Vc, eps: eps, eta: eta };
}
function otto(eps, k) { return 1 - Math.pow(1 / eps, k - 1); }

/* 토크 → 출력. unit: "nm" | "kgf" (kgf·m) */
function torqueToNm(T, unit) { return unit === "kgf" ? T * G : T; }
function powerFromTorque(T, unit, rpm) {
  var kW = torqueToNm(T, unit) * rpm * W_PER_RPM;
  return { kW: kW, PS: kW / KW_PER_PS };

      { t: "power", tab: "power", q: "엔진의 최대 출력이 최대 토크보다 높은 회전수에서 나오는 이유로 가장 알맞은 것은?",
        o: ["출력 = 토크 × 회전수 이므로, 토크가 조금 줄어도 회전수가 더 크게 늘면 출력은 계속 커진다", "고회전에서 토크가 다시 커지기 때문이다", "최대 토크 회전수에서는 연료가 공급되지 않기 때문이다", "출력과 토크는 서로 관계가 없기 때문이다"],
        note: "토크·출력 탭의 회색 띠(최대 토크 ~ 최대 출력)가 바로 이 구간입니다." },
      { t: "power", tab: "ihp", q: "고회전으로 갈수록 기계효율이 떨어지는 주된 이유는?",
        o: ["마찰·펌프 손실(손실마력)이 회전수에 따라 커지기 때문", "지시마력이 회전수와 무관하게 일정하기 때문", "연료의 발열량이 낮아지기 때문", "압축비가 낮아지기 때문"],
        note: "마력·효율 탭의 표에서 회전수별 기계효율을 확인해 보세요." },
      { t: "chassis", tab: "braking", q: "같은 노면에서 제동 시작 속도가 2배가 되면 제동거리(공주거리 제외)는?",
        o: ["4배가 된다", "2배가 된다", "√2 배가 된다", "변하지 않는다"],
        note: "제동거리 = v² / (2μg) 이므로 속도의 제곱에 비례합니다." },
      { t: "chassis", tab: "gears", q: "같은 엔진 회전수에서 변속비가 더 작은(높은) 기어로 바꾸면?",
        o: ["차속은 빨라지고 구동력은 작아진다", "차속과 구동력이 모두 커진다", "차속은 느려지고 구동력은 커진다", "차속과 구동력 모두 변하지 않는다"],
        note: "구동력·저항 탭에서 기어가 높을수록 구동력 곡선이 낮고 오른쪽(고속)으로 길게 뻗는 것을 볼 수 있습니다." },
      { t: "engine", tab: "compression", q: "오토 사이클에서 압축비를 높이면 이론열효율은?",
        o: ["높아진다", "낮아진다", "변하지 않는다", "비열비가 1.4 일 때만 낮아진다"],
        note: "η = 1 − (1/ε)^(k−1). 다만 실제 가솔린 기관은 노킹 때문에 압축비에 한계가 있습니다." }
    ];

    var sec = document.createElement("section");
    sec.id = "panel-quiz"; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-labelledby", "tab-quiz"); sec.hidden = true;
    sec.innerHTML = '<div class="qz"><div class="qz-bar"><div class="qz-chips" role="group" aria-label="출제 범위">' +
      [["all", "전체"], ["engine", "엔진"], ["power", "마력·효율"], ["chassis", "주행·제동"]].map(function (c, i) { return '<button type="button" class="chip" data-t="' + c[0] + '" aria-pressed="' + (i === 0) + '">' + c[1] + "</button>"; }).join("") +
      '</div><p class="qz-score" aria-live="polite"></p></div>' +
      '<article class="card qz-card"><p class="qz-meta"><span class="qz-no"></span><span class="qz-tag"></span></p><h3 class="qz-q"></h3><div class="qz-opts" role="group" aria-label="보기"></div>' +
      '<div class="qz-ex" hidden><p class="qz-verdict" role="status"></p><ol class="steps"></ol><p class="note-text"></p>' +
      '<div class="qz-actions"><button type="button" class="btn ghost" data-act="jump">계산기에서 확인 →</button><button type="button" class="btn primary" data-act="next">다음 문제</button></div></div></article>' +
      '<p class="hint">숫자 키 1~4 로 고르고 Enter 로 다음 문제로 넘어갑니다. 계산 문제의 숫자는 매번 새로 만들어집니다.</p></div>';
    $("#main").appendChild(sec);
    var Q = null, no = 0, right = 0, total = 0, streak = 0, filter = "all", lastGen = -1;
    var opts = $(".qz-opts", sec), ex = $(".qz-ex", sec), jumpBtn = $('[data-act="jump"]', sec), nextBtn = $('[data-act="next"]', sec);

    function distinct(vals) {
      for (var i = 0; i < vals.length; i++) for (var j = i + 1; j < vals.length; j++) {
        var a = vals[i], b = vals[j]; if (!isFinite(a) || !isFinite(b) || Math.abs(a - b) / Math.max(Math.abs(a), Math.abs(b)) < 0.04) return false;
      }
      return true;
    }
    function make() {
      var pool = [], i;
      GEN.forEach(function (g, k) { pool.push({ k: k }); });
      CONCEPT.forEach(function (c, k) { pool.push({ k: 100 + k }); });
      for (var tries = 0; tries < 60; tries++) {
        var it = pick(pool);
        if (it.k === lastGen && pool.length > 1) continue;
        if (it.k >= 100) {
          var c = CONCEPT[it.k - 100]; if (filter !== "all" && c.t !== filter) continue;
          var order = shuffle([0, 1, 2, 3]);
          lastGen = it.k;
          return { t: c.t, tab: c.tab, q: c.q, opts: order.map(function (o) { return c.o[o]; }), ai: order.indexOf(0), steps: [], note: c.note, jump: function () {} };
        }
        var p = GEN[it.k]();
        if (filter !== "all" && p.t !== filter) continue;
        var vals = [p.a].concat(p.w);
        if (!distinct(vals.map(function (v) { return +v.toFixed(p.d); }))) continue;
        var ord = shuffle([0, 1, 2, 3]);
        lastGen = it.k;
        return { t: p.t, tab: p.tab, q: p.q, opts: ord.map(function (o) { return fmt(vals[o], p.d) + " " + p.u; }), ai: ord.indexOf(0), steps: p.steps, note: p.note, jump: p.jump };
      }
      return null;
    }
    function score() {
      $(".qz-score", sec).innerHTML = "맞힘 <b>" + right + "</b> / " + total + (streak > 1 ? " · 연속 <b>" + streak + "</b>" : "");
    }
    function next() {
      Q = make(); if (!Q) return;
      no++;
      $(".qz-no", sec).textContent = "문제 " + no;
      $(".qz-tag", sec).textContent = TOPIC[Q.t];
      $(".qz-q", sec).textContent = Q.q;
      opts.innerHTML = Q.opts.map(function (o, i) { return '<button type="button" class="qz-opt" data-i="' + i + '"><span class="n">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>"; }).join("");
      ex.hidden = true; Q.done = false; score();
    }
    function answer(i, byKey) {
      if (!Q || Q.done) return;
      Q.done = true; total++;
      var ok = i === Q.ai; if (ok) { right++; streak++; } else streak = 0;
      Array.prototype.forEach.call(opts.children, function (b, k) {
        b.disabled = true;
        b.dataset.state = k === Q.ai ? "right" : k === i ? "wrong" : "dim";
      });
      var v = $(".qz-verdict", sec);
      v.className = "qz-verdict " + (ok ? "ok" : "no");
      v.textContent = ok ? "정답입니다." : "오답입니다. 정답은 " + (Q.ai + 1) + "번 " + Q.opts[Q.ai] + " 입니다.";
      $(".steps", sec).innerHTML = Q.steps.map(function (s) { return '<li><span class="what">' + esc(s[0]) + "</span><code>" + s[1] + "</code></li>"; }).join("");
      $(".steps", sec).hidden = !Q.steps.length;
      $(".note-text", sec).textContent = Q.note || "";
      jumpBtn.hidden = !Q.tab;
      ex.hidden = false; score();
      if (byKey) nextBtn.focus({ preventScroll: true });   // 키보드로 답했을 때만 다음 버튼으로 초점 이동
    }
    opts.addEventListener("click", function (e) { var b = e.target.closest(".qz-opt"); if (b) answer(+b.dataset.i); });
    nextBtn.addEventListener("click", function (e) { next(); var f = opts.firstElementChild; if (f && e.detail === 0) f.focus({ preventScroll: true }); });
    jumpBtn.addEventListener("click", function () {
      if (!Q || !Q.tab) return;
      Q.jump(); show(Q.tab);
      $("#tabs").scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
    });
    $(".qz-chips", sec).addEventListener("click", function (e) {
      var c = e.target.closest(".chip"); if (!c || c.dataset.t === filter) return;
      filter = c.dataset.t;
      Array.prototype.forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", x === c); });
      next();
    });
    document.addEventListener("keydown", function (e) {
      if (sec.hidden || e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || "")) return;
      if (/^[1-4]$/.test(e.key) && Q && !Q.done) { e.preventDefault(); answer(+e.key - 1, true); }
      else if (e.key === "Enter" && Q && Q.done && e.target === document.body) { e.preventDefault(); nextBtn.click(); }
    });
    return { sec: sec, update: function () { if (!Q) next(); } };
  })();

  /* ---------- 탭 전환: 주소의 # 값(plain token)과 동기화, 밑줄이 이동 ---------- */
  var tabs = { compression: comp, power: pw, ihp: ihp, gears: gears, drive: drive, braking: brk, quiz: quiz }, ids = Object.keys(tabs);
  var ind = $("#ind"), btns = ids.map(function (k) { return $("#tab-" + k); });
  function show(id, focus) {
    if (!tabs[id]) id = "compression";
    ids.forEach(function (k, i) {
      var on = k === id; btns[i].setAttribute("aria-selected", on); btns[i].tabIndex = on ? 0 : -1; tabs[k].sec.hidden = !on;
      if (on) {
        ind.style.width = btns[i].offsetWidth + "px"; ind.style.transform = "translateX(" + btns[i].offsetLeft + "px)"; if (focus) btns[i].focus();
        var tb = $("#tabs"), bl = btns[i].offsetLeft, br = bl + btns[i].offsetWidth;   // 좁은 화면: 선택한 탭이 가려져 있으면 보이도록 가로 스크롤
        if (bl < tb.scrollLeft || br > tb.scrollLeft + tb.clientWidth) tb.scrollTo({ left: Math.max(0, bl - 16), behavior: RM ? "auto" : "smooth" });
      }
    });
    tabs[id].update();
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* 미리보기 환경에서는 주소 변경이 막힐 수 있다 */ }
  }
  btns.forEach(function (b, i) {
    b.addEventListener("click", function () { show(ids[i]); });
    b.addEventListener("keydown", function (e) {
      var j = i; if (e.key === "ArrowRight") j = (i + 1) % ids.length; else if (e.key === "ArrowLeft") j = (i + ids.length - 1) % ids.length; else return;
      e.preventDefault(); show(ids[j], true);
    });
  });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  window.addEventListener("resize", function () { var i = btns.findIndex(function (b) { return b.getAttribute("aria-selected") === "true"; }); if (i >= 0) { ind.style.width = btns[i].offsetWidth + "px"; ind.style.transform = "translateX(" + btns[i].offsetLeft + "px)"; } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { var i = btns.findIndex(function (b) { return b.getAttribute("aria-selected") === "true"; }); if (i >= 0) { ind.style.width = btns[i].offsetWidth + "px"; ind.style.transform = "translateX(" + btns[i].offsetLeft + "px)"; } });
  ids.forEach(function (k) { tabs[k].update(); });
  show((location.hash || "").slice(1));
})();
</script>
